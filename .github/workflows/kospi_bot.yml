name: KOSPI G-ensemble Bot

on:
  # [비활성화 2026-07-25] GCP Cloud Run Always Free 티어로 운영 전환.
  # 자동 스케줄 실행은 GCP Cloud Scheduler가 담당.
  # schedule:
  #   - cron: '10 0 * * *'
  workflow_dispatch: # 수동 실행 버튼 (테스트용 유지)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run G-ensemble Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          python main.py
